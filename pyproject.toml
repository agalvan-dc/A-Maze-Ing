[tool.poetry]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator package from A-Maze-Ing"
authors = [
    "agalvan-",
    "caperale"
]
readme = "README.md"

packages = [
    { include = "mazegen" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = "^1.26.0"
pydantic = "^2.6.0"

[tool.poetry.group.dev.dependencies]
build = "^1.2.2"
flake8 = "^7.0.0"
flake8-pyproject = "^1.2.3"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "mlx_CLXV",
    "mlx_docs"
]

[tool.mypy]
exclude = [
    "venv",
    ".venv",
    "mlx_CLXV",
    "mlx_docs"
]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true